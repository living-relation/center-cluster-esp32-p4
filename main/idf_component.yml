idf_component_manager_version: 2

dependencies:
  idf:
    # ESP32-P4 needs IDF 5.4.x: 5.3.x lacks stable MIPI-DSI; 5.5+ dropped support for
    # early P4 v1.x silicon (this board). Tested on 5.4.2.
    version: ">=5.4,<5.5"

  # LVGL 9.x — the UI library
  lvgl/lvgl:
    version: "~9.2.0"

  # LVGL bring-up helper (handles double buffering, refresh task)
  espressif/esp_lvgl_port:
    version: "~2.4"

  # JD9365 MIPI-DSI panel driver — the controller on the integrated Waveshare
  # ESP32-P4-WIFI6-Touch-LCD-3.4C (800×800 round). This is the same driver the
  # official Espressif/Waveshare BSP for this board uses. We previously tried
  # `waveshare/esp_lcd_dsi`, but that driver is for Waveshare's *standalone*
  # DSI displays (separate adapter PCB with an I2C bias chip at 0x45) and sends
  # only sleep-out/display-on — not the panel-specific gamma/timing init that
  # the bare JD9365 needs, leaving the screen blank.
  espressif/esp_lcd_jd9365:
    version: "~2.0"

  espressif/es8311:
    version: "^1.0.0"
