idf_component_manager_version: 2

dependencies:
  idf:
    # ESP32-P4 needs a recent core IDF for stable MIPI-DSI + HEX-PSRAM support.
    # Use 5.4 or newer (your VS Code is set up on 5.5.4). Do NOT use 5.3.x for the P4.
    version: ">=5.4"

  # LVGL 9.x — the UI library
  lvgl/lvgl:
    version: "~9.2.0"

  # LVGL bring-up helper (handles double buffering, refresh task)
  espressif/esp_lvgl_port:
    version: "~2.4"

  # Round-LCD panel driver (the Waveshare ESP32-P4 round-LCD SKUs use
  # GC9503-class DSI panels; swap this line if your board ships with a
  # different controller — see firmware/README.md).
  # NOTE: This is configured by `bsp.c`; if the managed component is not
  # available in your IDF registry mirror, comment it out and the GC9503
  # init in bsp.c will fall back to direct register writes.
  # espressif/esp_lcd_gc9503: "~3.0.1"   # Only available for esp32s3; bsp.c falls back to generic DPI driver on esp32p4
